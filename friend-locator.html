<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f1e">
<title>WherAreU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- Firebase carregado via CDN compatível -->
<style>
  :root {
    --bg: #060b18;
    --surface: #0d1528;
    --border: #1e2d4a;
    --accent: #00f5c4;
    --accent2: #ff6b35;
    --text: #e8edf5;
    --muted: #5a6a85;
    --glow: 0 0 20px rgba(0,245,196,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    z-index: 100;
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    display: inline-block;
    margin-right: 6px;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .status-dot.online { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .status-dot.friend { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }
  #status-text { font-size: 0.7rem; color: var(--muted); }

  /* SETUP SCREEN */
  #setup-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .setup-card h2 {
    font-family: 'Syne', sans-serif;
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .setup-card p {
    color: var(--muted);
    font-size: 0.78rem;
    line-height: 1.6;
    margin-bottom: 28px;
  }
  .input-group {
    margin-bottom: 16px;
    text-align: left;
  }
  .input-group label {
    display: block;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  .room-display {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  #room-code {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--accent);
  }
  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    transition: all 0.2s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 10px;
  }
  .btn-primary {
    background: var(--accent);
    color: var(--bg);
  }
  .btn-primary:hover { box-shadow: var(--glow); transform: translateY(-1px); }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 18px 0;
    color: var(--muted);
    font-size: 0.7rem;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* MAIN APP */
  #app-screen {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
  }
  #map {
    flex: 1;
    min-height: 0;
    position: relative;
  }

  /* INFO PANEL */
  #info-panel {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    flex-shrink: 0;
    max-height: 42vh;
    overflow-y: auto;
  }
  .waiting-msg {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 20px 0;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }
  .stat-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .stat-card.highlight { border-color: var(--accent); }
  .stat-label {
    font-size: 0.6rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 4px;
  }
  .stat-value {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--text);
  }
  .stat-value.accent { color: var(--accent); }
  .stat-value.accent2 { color: var(--accent2); }

  .travel-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .travel-card {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
  }
  .travel-icon { font-size: 1.2rem; margin-bottom: 4px; }
  .travel-label { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .travel-time { font-size: 0.85rem; font-weight: 700; margin-top: 2px; color: var(--text); }

  .locations-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .location-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .location-name { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .location-coords { font-size: 0.72rem; color: var(--text); line-height: 1.5; }
  .location-tz { font-size: 0.68rem; color: var(--accent2); margin-top: 4px; }

  /* Leaflet custom */
  .my-marker, .friend-marker {
    width: 14px !important; height: 14px !important;
    border-radius: 50%;
    border: 2px solid var(--bg);
    box-shadow: 0 0 10px currentColor;
  }
  .my-marker { background: var(--accent); }
  .friend-marker { background: var(--accent2); }

  /* Scrollbar */
  #info-panel::-webkit-scrollbar { width: 4px; }
  #info-panel::-webkit-scrollbar-track { background: transparent; }
  #info-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .error-msg { color: #ff4d4d; font-size: 0.75rem; margin-top: 8px; text-align: center; }
</style>
</head>
<body>

<header>
  <div class="logo">Wher<span>Are</span>U</div>
  <div>
    <span class="status-dot" id="my-dot"></span>
    <span class="status-dot friend" id="friend-dot" style="display:none"></span>
    <span id="status-text">disconnected</span>
  </div>
</header>

<!-- SETUP -->
<div id="setup-screen">
  <div class="setup-card">
    <h2>Where's your friend?</h2>
    <p>Create a room and share the code — or join an existing one.<br>No sign-up, no account.</p>

    <div class="input-group">
      <label>Your name</label>
      <input type="text" id="username" placeholder="e.g. John" maxlength="20">
    </div>

    <div class="room-display">
      <span id="room-code">——</span>
      <button class="copy-btn" onclick="copyRoom()">copy</button>
    </div>

    <button class="btn btn-primary" onclick="createRoom()">✦ Create room</button>

    <div class="divider">ou</div>

    <div class="input-group">
      <label>Room code</label>
      <input type="text" id="join-code" placeholder="e.g. X7K2" maxlength="6" style="text-transform:uppercase">
    </div>
    <button class="btn btn-secondary" onclick="joinRoom()">→ Join room</button>

    <div class="error-msg" id="setup-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app-screen">
  <div id="map"></div>
  <div id="info-panel">
    <div class="waiting-msg" id="waiting-msg">⟳ Waiting for your friend to connect...</div>
    <div id="stats-content" style="display:none"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ── Firebase config ──
const app = initializeApp({
  apiKey: "AIzaSyA4sAle4wqTXPVx82ee5SnBmKdOvHOm_Y4",
  authDomain: "wherareu-a31b5.firebaseapp.com",
  databaseURL: "https://wherareu-a31b5-default-rtdb.firebaseio.com",
  projectId: "wherareu-a31b5",
  storageBucket: "wherareu-a31b5.firebasestorage.app",
  messagingSenderId: "524849394130",
  appId: "1:524849394130:web:066f92aacb7552b212980b"
});
// ────────────────────────────────────────────────────

const db = getDatabase(app);

let map, myMarker, friendMarker, connectionLine;
let myPos = null, friendPos = null;
let roomId = null, myName = '', myRole = '';

// ── Gera código de sala ──
function genCode() {
  return Math.random().toString(36).slice(2,6).toUpperCase();
}

// ── Inicializa o mapa ──
function initMap() {
  map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    maxZoom: 18
  }).addTo(map);
  L.control.zoom({ position: 'topright' }).addTo(map);
}

// ── Marcadores customizados ──
function makeIcon(color) {
  return L.divIcon({
    className: '',
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #060b18;box-shadow:0 0 10px ${color}"></div>`,
    iconSize: [14,14], iconAnchor: [7,7]
  });
}

// ── Cria sala ──
window.createRoom = function() {
  const name = document.getElementById('username').value.trim();
  if (!name) { showError('Please enter your name first!'); return; }
  roomId = genCode();
  myName = name; myRole = 'host';

  // Mostra o código e troca o botão
  document.getElementById('room-code').textContent = roomId;
  const btn = document.querySelector('.btn-primary');
  btn.textContent = '→ Enter map';
  btn.onclick = startSession;
  const err = document.getElementById('setup-error');
  err.style.color = 'var(--accent)';
  err.textContent = 'Share the code above with your friend!';
}

// ── Entra na sala ──
window.joinRoom = function() {
  const name = document.getElementById('username').value.trim();
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  if (!name) { showError('Please enter your name!'); return; }
  if (code.length < 4) { showError('Invalid code.'); return; }
  roomId = code;
  document.getElementById('room-code').textContent = roomId;
  myName = name; myRole = 'guest';
  startSession();
}

window.copyRoom = function() {
  const code = document.getElementById('room-code').textContent;
  if (code === '——') return;
  navigator.clipboard.writeText(code);
  document.querySelector('.copy-btn').textContent = 'copied!';
  setTimeout(() => document.querySelector('.copy-btn').textContent = 'copy', 1500);
}

function showError(msg) {
  document.getElementById('setup-error').textContent = msg;
  setTimeout(() => document.getElementById('setup-error').textContent = '', 3000);
}

// ── Inicia sessão ──
async function startSession() {
  document.getElementById('setup-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'flex';
  document.getElementById('status-text').textContent = 'getting location...';
  initMap();
  watchLocation();
}

// ── Geolocalização ──
function watchLocation() {
  if (!navigator.geolocation) { alert('Geolocalização não suportada.'); return; }
  navigator.geolocation.watchPosition(
    pos => onMyPosition(pos),
    err => console.warn('Geo error:', err),
    { enableHighAccuracy: true, maximumAge: 10000 }
  );
}

async function onMyPosition(pos) {
  myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };

  // Salva no Firebase
  try {
    await set(ref(db, `rooms/${roomId}/${myRole}`), {
      name: myName,
      lat: myPos.lat,
      lng: myPos.lng,
      ts: Date.now()
    });
  } catch(e) {
    // Firebase não configurado — modo demo local
    useDemoMode(myPos);
    return;
  }

  // Apaga dados ao fechar/sair da página
  if (!window._cleanupRegistered) {
    window._cleanupRegistered = true;
    const cleanup = () => {
      navigator.sendBeacon(
        `https://wherareu-a31b5-default-rtdb.firebaseio.com/rooms/${roomId}/${myRole}.json`,
        JSON.stringify(null)
      );
    };
    window.addEventListener('beforeunload', cleanup);
    window.addEventListener('pagehide', cleanup);
  }

  updateMyMarker();
  updateStatus();
  listenFriend();
}

// ── Demo mode (sem Firebase real) ──
function useDemoMode(pos) {
  document.getElementById('my-dot').classList.add('online');
  document.getElementById('status-text').textContent = 'demo mode (no Firebase)';
  updateMyMarker();
  map.setView([pos.lat, pos.lng], 12);

  // Simula um amigo em São Paulo
  const demoFriendPos = { lat: -23.5505, lng: -46.6333 };
  friendPos = demoFriendPos;
  const demoFriend = { name: 'Demo Friend', lat: demoFriendPos.lat, lng: demoFriendPos.lng };
  document.getElementById('friend-dot').style.display = 'inline-block';
  document.getElementById('waiting-msg').style.display = 'none';
  document.getElementById('stats-content').style.display = 'block';
  updateFriendMarker(demoFriend);
  fitBoth();
  renderStats(demoFriend);
}

// ── Escuta posição do amigo ──
function listenFriend() {
  const friendRole = myRole === 'host' ? 'guest' : 'host';
  onValue(ref(db, `rooms/${roomId}/${friendRole}`), snap => {
    if (!snap.exists()) return;
    const data = snap.val();
    friendPos = { lat: data.lat, lng: data.lng };
    document.getElementById('friend-dot').style.display = 'inline-block';
    document.getElementById('waiting-msg').style.display = 'none';
    document.getElementById('stats-content').style.display = 'block';
    updateFriendMarker(data);
    fitBoth();
    renderStats(data);
    updateStatus();
  });
}

function updateMyMarker() {
  if (!myPos) return;
  if (!myMarker) {
    myMarker = L.marker([myPos.lat, myPos.lng], { icon: makeIcon('#00f5c4') })
      .bindTooltip(myName, { permanent: true, direction: 'top', offset: [0,-10], className: 'leaflet-tooltip-custom' })
      .addTo(map);
  } else {
    myMarker.setLatLng([myPos.lat, myPos.lng]);
  }
}

function updateFriendMarker(data) {
  if (!friendMarker) {
    friendMarker = L.marker([data.lat, data.lng], { icon: makeIcon('#ff6b35') })
      .bindTooltip(data.name, { permanent: true, direction: 'top', offset: [0,-10] })
      .addTo(map);
  } else {
    friendMarker.setLatLng([data.lat, data.lng]);
  }
  if (connectionLine) map.removeLayer(connectionLine);
  if (myPos) {
    connectionLine = L.polyline(
      [[myPos.lat, myPos.lng], [data.lat, data.lng]],
      { color: '#ffffff20', weight: 1.5, dashArray: '6 6' }
    ).addTo(map);
  }
}

function fitBoth() {
  if (!myPos || !friendPos) return;
  const bounds = L.latLngBounds([
    [myPos.lat, myPos.lng],
    [friendPos.lat, friendPos.lng]
  ]);
  map.fitBounds(bounds, { padding: [60, 60] });
}

function updateStatus() {
  document.getElementById('my-dot').classList.add('online');
  document.getElementById('status-text').textContent =
    friendPos ? 'you and your friend online' : 'you online — waiting for friend';
}

// ── Cálculos ──
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function bearing(lat1, lng1, lat2, lng2) {
  const dLng = (lng2-lng1)*Math.PI/180;
  const y = Math.sin(dLng)*Math.cos(lat2*Math.PI/180);
  const x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) -
             Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLng);
  const b = (Math.atan2(y,x)*180/Math.PI + 360) % 360;
  return Math.round(b);
}

function bearingName(deg) {
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(deg/45)%8];
}

function formatDist(km) {
  if (km < 1) return `${Math.round(km*1000)}m`;
  if (km < 100) return `${km.toFixed(1)}km`;
  return `${Math.round(km).toLocaleString('en-US')}km`;
}

function travelTime(km, speedKmh) {
  const h = km/speedKmh;
  if (h < 1) return `${Math.round(h*60)}min`;
  const hh = Math.floor(h), mm = Math.round((h-hh)*60);
  return mm ? `${hh}h ${mm}min` : `${hh}h`;
}

function getTimezone(lat, lng) {
  // Estimativa simples por offset UTC baseado na longitude
  const offset = Math.round(lng/15);
  const sign = offset >= 0 ? '+' : '';
  return `UTC${sign}${offset}`;
}

function fmtCoord(lat, lng) {
  const la = `${Math.abs(lat).toFixed(4)}° ${lat>=0?'N':'S'}`;
  const lo = `${Math.abs(lng).toFixed(4)}° ${lng>=0?'E':'W'}`;
  return `${la}\n${lo}`;
}

// ── Render stats ──
function renderStats(friend) {
  if (!myPos) return;
  const km = haversine(myPos.lat, myPos.lng, friend.lat, friend.lng);
  const bear = bearing(myPos.lat, myPos.lng, friend.lat, friend.lng);
  const friendBear = (bear + 180) % 360;

  const myTZ = getTimezone(myPos.lat, myPos.lng);
  const friendTZ = getTimezone(friend.lat, friend.lng);
  const sameZone = myTZ === friendTZ;

  const walkSpeed = 5, carSpeed = 80, planeSpeed = 900;

  document.getElementById('stats-content').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card highlight">
        <div class="stat-label">Straight-line distance</div>
        <div class="stat-value accent">${formatDist(km)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Direction (you → friend)</div>
        <div class="stat-value">${bear}° ${bearingName(bear)}</div>
      </div>
    </div>

    <div class="travel-row">
      <div class="travel-card">
        <div class="travel-icon">✈️</div>
        <div class="travel-label">Plane</div>
        <div class="travel-time">${travelTime(km, planeSpeed)}</div>
      </div>
      <div class="travel-card">
        <div class="travel-icon">🚗</div>
        <div class="travel-label">Car/Bus</div>
        <div class="travel-time">${travelTime(km, carSpeed)}</div>
      </div>
      <div class="travel-card">
        <div class="travel-icon">🚶</div>
        <div class="travel-label">Walking</div>
        <div class="travel-time">${travelTime(km, walkSpeed)}</div>
      </div>
    </div>

    <div class="locations-row">
      <div class="location-card">
        <div class="location-name">◉ You (${myName})</div>
        <div class="location-coords">${fmtCoord(myPos.lat, myPos.lng)}</div>
        <div class="location-tz">${myTZ} · Direction to friend: ${bear}° ${bearingName(bear)}</div>
      </div>
      <div class="location-card">
        <div class="location-name" style="color:#ff6b35">◉ ${friend.name}</div>
        <div class="location-coords">${fmtCoord(friend.lat, friend.lng)}</div>
        <div class="location-tz">${friendTZ}${sameZone ? ' · same timezone' : ' · different timezone ⚠️'} · Dir.: ${friendBear}° ${bearingName(friendBear)}</div>
      </div>
    </div>
  `;
}
</script>

<!--
  ╔══════════════════════════════════════════════════════════════╗
  ║  COMO CONFIGURAR O FIREBASE (gratuito, 5 minutos)           ║
  ╠══════════════════════════════════════════════════════════════╣
  ║  1. Acesse: https://console.firebase.google.com             ║
