<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="20" fill="#0d1528"/>
  <!-- Globe outline -->
  <circle cx="50" cy="44" r="22" fill="none" stroke="#00f5c4" stroke-width="2.5"/>
  <!-- Latitude lines -->
  <ellipse cx="50" cy="44" rx="22" ry="8" fill="none" stroke="#00f5c4" stroke-width="1.5" opacity="0.5"/>
  <!-- Vertical line -->
  <line x1="50" y1="22" x2="50" y2="66" stroke="#00f5c4" stroke-width="1.5" opacity="0.5"/>
  <!-- Horizontal line -->
  <line x1="28" y1="44" x2="72" y2="44" stroke="#00f5c4" stroke-width="1.5" opacity="0.5"/>
  <!-- My dot -->
  <circle cx="40" cy="38" r="3.5" fill="#00f5c4"/>
  <!-- Friend dot -->
  <circle cx="60" cy="50" r="3.5" fill="#ff6b35"/>
  <!-- Connection line -->
  <line x1="40" y1="38" x2="60" y2="50" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.4"/>
  <!-- "W" text hint at bottom -->
  <text x="50" y="92" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="13" fill="#00f5c4" letter-spacing="1">WAU</text>
</svg>
